name: Publish to Modrinth

# Uploads the Together Optimized .mrpack from a GitHub Release to
# https://modrinth.com/modpack/together-optimized. Not published to CurseForge.
# Named publish-modrinth.yml (not auto-publish.yml) so sync-upstream does not disable it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub release tag to publish (leave empty for latest)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-modrinth
  cancel-in-progress: false

jobs:
  publish-to-modrinth:
    if: github.repository_owner != 'Fabulously-Optimized'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout tooling (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(gh release list -R "$GH_REPO" --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          if [ -z "$TAG" ]; then
            echo "No release tag found." >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"

      - name: Resolve version type and changelog
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          case "$VERSION" in
            *alpha*) TYPE=alpha ;;
            *beta*) TYPE=beta ;;
            *) TYPE=release ;;
          esac
          echo "version_type=$TYPE" >> "$GITHUB_OUTPUT"

          BODY="$(gh release view "$TAG" -R "$GH_REPO" --json body --jq '.body // empty')"
          {
            echo "changelog<<EOF"
            if [ -n "$BODY" ]; then
              printf '%s\n' "$BODY"
            else
              echo "Together Optimized ${VERSION}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download mrpack from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$TAG" -R "$GH_REPO" -D dist -p "Together.Optimized-*.mrpack"
          ls -lh dist/
          test -n "$(find dist -maxdepth 1 -name 'Together.Optimized-*.mrpack' -print -quit)"

      - name: Detect Minecraft version from mrpack
        id: mc
        run: |
          MRPACK="$(find dist -maxdepth 1 -name 'Together.Optimized-*.mrpack' -print -quit)"
          MC="$(unzip -p "$MRPACK" modrinth.index.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["dependencies"]["minecraft"])')"
          if [ -z "$MC" ]; then
            echo "Could not read minecraft version from mrpack." >&2
            exit 1
          fi
          echo "version=$MC" >> "$GITHUB_OUTPUT"
          echo "Minecraft version: $MC"

      # mc-publish expects a base62 project id; slugs with hyphens fail Modrinth's API.
      - name: Resolve Modrinth project id
        id: modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          PROJECT_ID="$(python3 "CLI tools/resolve-modrinth-project.py")"
          if [ -z "$PROJECT_ID" ]; then
            echo "Could not resolve Modrinth project id for together-optimized" >&2
            exit 1
          fi
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved Modrinth project id: $PROJECT_ID"

      - name: Publish to Modrinth
        uses: Kira-NT/mc-publish@995edadc13559a8b28d0b7e6571229f067ec7659 # v3.3.0
        with:
          name: Together Optimized ${{ steps.tag.outputs.version }} for ${{ steps.mc.outputs.version }}
          version: ${{ steps.tag.outputs.version }}
          version-type: ${{ steps.meta.outputs.version_type }}
          changelog: ${{ steps.meta.outputs.changelog }}
          modrinth-id: ${{ steps.modrinth.outputs.project_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-unfeature-mode: none
          files: dist/Together.Optimized-*.mrpack
          loaders: fabric
          game-versions: ${{ steps.mc.outputs.version }}
          game-version-filter: none

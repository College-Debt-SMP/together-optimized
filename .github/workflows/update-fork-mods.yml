name: Update fork mods

# Manually update fork-only Modrinth mods across retained Packwiz folders and
# publish a new zip+mrpack GitHub Release when anything changes.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  update-fork-mods:
    if: github.repository_owner != 'Fabulously-Optimized'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          packwiz --help >/dev/null

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record starting pack version
        id: start
        run: |
          START_VERSION="$(python3 "CLI tools/fork-version.py" print)"
          echo "version=$START_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update fork mods on all retained folders
        id: forkmods
        run: |
          python3 "CLI tools/update-fork-mods.py" \
            --markdown-out /tmp/fork-mods.md \
            --json-out /tmp/fork-mods.json
          CHANGED="$(python3 -c 'import json; print(str(json.load(open("/tmp/fork-mods.json"))["changed"]).lower())')"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Fork mods changed: $CHANGED"

      - name: Decide fork version
        id: version
        run: |
          ARGS=(decide --start-version "${{ steps.start.outputs.version }}" --env-out /tmp/version.env)
          if [ "${{ steps.forkmods.outputs.changed }}" = "true" ]; then
            ARGS+=(--fork-mods-changed)
          fi
          python3 "CLI tools/fork-version.py" "${ARGS[@]}"
          cat /tmp/version.env >> "$GITHUB_ENV"
          cat /tmp/version.env

      - name: Stop if nothing to release
        if: env.RELEASE != 'true'
        run: echo "No fork-mod updates to release."

      - name: Update changelog
        if: env.RELEASE == 'true'
        run: |
          python3 "CLI tools/update-changelog.py" \
            --changelog CHANGELOG.md \
            --version "$VERSION" \
            --fragment /tmp/fork-mods.md \
            --reason "${{ env.REASON }}"
          newest="$(find Packwiz -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n1)"
          (cd "Packwiz/$newest" && packwiz refresh -y)

      - name: Commit and push
        if: env.RELEASE == 'true'
        run: |
          git add -A
          git commit -m "Release Together Optimized ${VERSION}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Export release artifacts
        if: env.RELEASE == 'true'
        run: bash "CLI tools/export-release.sh" "$PWD/dist"

      - name: Create GitHub Release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping create."
            exit 0
          fi
          NOTES_FILE="$(mktemp)"
          {
            echo "## Together Optimized ${VERSION}"
            echo
            echo "${REASON}"
            echo
            cat /tmp/fork-mods.md
          } > "$NOTES_FILE"
          gh release create "$TAG" \
            --title "Together Optimized ${VERSION}" \
            --notes-file "$NOTES_FILE" \
            dist/Together.Optimized-*.zip \
            dist/Together.Optimized-*.mrpack

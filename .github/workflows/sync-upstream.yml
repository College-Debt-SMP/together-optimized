name: Sync upstream Fabulously Optimized

# Merges Fabulously-Optimized/fabulously-optimized into this fork.
# Never pushes to the upstream repository.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_owner != 'Fabulously-Optimized'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote (fetch only)
        run: |
          git remote add upstream https://github.com/Fabulously-Optimized/fabulously-optimized.git
          git remote set-url --push upstream DISABLE
          git fetch upstream main

      - name: Merge upstream/main
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream/main."
            echo "synced=false" >> "$GITHUB_ENV"
          else
            git merge --no-ff upstream/main -m "Merge upstream Fabulously Optimized into fork"
            echo "synced=true" >> "$GITHUB_ENV"
          fi

      - name: Prune older Packwiz version directories
        if: env.synced == 'true'
        run: bash "CLI tools/prune-old-packwiz.sh"

      - name: Disable upstream workflows and community docs if reintroduced
        if: env.synced == 'true'
        run: |
          mkdir -p .github/upstream-workflows
          for wf in auto-publish.yml git-repo-sync.yml; do
            if [ -f ".github/workflows/$wf" ]; then
              mv ".github/workflows/$wf" ".github/upstream-workflows/$wf"
              echo "Disabled $wf"
            fi
          done
          rm -f .github/FUNDING.yml .github/pull_request_template.md crowdin.yml cape.png \
            CODE-OF-CONDUCT.md CONTRIBUTING.md SECURITY.md
          rm -rf .github/ISSUE_TEMPLATE

      - name: Commit fork maintenance if needed
        if: env.synced == 'true'
        run: |
          if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git add -A Packwiz .github/workflows .github/upstream-workflows
            git commit -m "Apply fork maintenance after upstream sync"
          else
            echo "No fork maintenance changes to commit."
          fi

      - name: Push to fork origin only
        if: env.synced == 'true'
        run: |
          git remote -v
          git push origin HEAD:${{ github.ref_name }}
